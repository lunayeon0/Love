<!DOCTYPE html>
<html>
<head>
  <title>어버이날</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      text-align: center;
      color: white;
      font-family: sans-serif;

      background-image: url('https://images.unsplash.com/photo-1525310072745-f49212b5ac6d');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
    }

    .box {
      background: rgba(0,0,0,0.5);
      margin: 100px auto;
      padding: 40px;
      width: 85%;
      border-radius: 25px;
    }

    h1 {
      font-size: 60px;
    }

    h2 {
      font-size: 45px;
    }

    p {
      font-size: 28px;
    }

    .sign {
      font-size: 24px;
      margin-top: 30px;
    }

    /* 🔥 버튼 스타일 */
    .btn {
      margin-top: 30px;
      padding: 15px 25px;
      font-size: 20px;
      border: none;
      border-radius: 15px;
      background-color: pink;
      color: black;
      cursor: pointer;
    }
  </style>

  <script>
    function showMessage() {
      alert("엄마 아빠 사랑해요 💐💕\n항상 감사합니다!");
    }
  </script>
</head>

<body>
  <div class="box">
    <h1>💐 어버이날 💐</h1>
    <h2>엄마 아빠 사랑해요 💕</h2>
    <p>항상 감사하고 사랑합니다</p>

    <!-- 🔥 버튼 -->
    <button class="btn" onclick="showMessage()">눌러보세요 💌</button>

    <p class="sign"><b>- 수연 올림 -</b></p>
  </div>
</body>
</html>
